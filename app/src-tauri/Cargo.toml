# The desktop shell's own Cargo workspace (v0.3 plan Task 14, spec §7.3).
# It is separate from the engine workspace so the `libsqlite3-sys` patch
# applies only here: rusqlite's bundled build compiles the vendored copy,
# which swaps the stock sqlite3.c for SQLite3 Multiple Ciphers.
[workspace]
resolver = "2"
members = [".", "store"]
exclude = ["vendor/libsqlite3-sys"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-only"

[package]
name = "epiora-app"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = { version = "2.8.4" }
epiora-store-native = { path = "store" }
keyring = "4.2.0"
getrandom = "0.4.3"
serde = { version = "1", features = ["derive"] }
# v1.1 Task 9 (spec §4.1): the desktop-only SQL Server reader. 0.13.0
# shipped on crates.io 2026-11-20 (<7 days at task time — supply-chain
# policy pins the newest release at least a week old, so 0.12.3, July
# 2024). `rustls` keeps the binary free of OpenSSL; `tds73` is the
# SQL Server 2008+ protocol; `winauth` is cfg(windows)-gated inside
# tiberius and enables AuthMethod::Integrated on Windows builds only.
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "rustls", "winauth"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio = { version = "1", features = ["net"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
epiora-legacy = { path = "../../crates/epiora-legacy" }

[patch.crates-io]
libsqlite3-sys = { path = "vendor/libsqlite3-sys" }

# Matches the v0.1 tauri-shell spike's release profile.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
