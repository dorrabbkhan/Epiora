# The desktop shell's own Cargo workspace (v0.3 plan Task 14, spec §7.3).
# It is separate from the engine workspace so the `libsqlite3-sys` patch
# applies only here: rusqlite's bundled build compiles the vendored copy,
# which swaps the stock sqlite3.c for SQLite3 Multiple Ciphers.
[workspace]
resolver = "2"
members = [".", "store"]
exclude = ["vendor/libsqlite3-sys"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "AGPL-3.0-only"

[package]
name = "epiora-app"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = { version = "2.8.4" }
epiora-store-native = { path = "store" }
keyring = "4.2.0"
getrandom = "0.4.3"

[patch.crates-io]
libsqlite3-sys = { path = "vendor/libsqlite3-sys" }

# Matches the v0.1 tauri-shell spike's release profile.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
