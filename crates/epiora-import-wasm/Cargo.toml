[package]
name = "epiora-import-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Epiora import browser binding: type conversion only (v0.3 spec §6)"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# `parity` adds `runImportCase`, which the Node parity run (v0.3 spec
# §6.5) drives through `parity/run.mjs`. It is compiled into
# `pkg-parity/` only, never the shipped release binding.
parity = []
# `ts` enables the bindings export test (`cargo test -p
# epiora-import-wasm --features ts export_bindings`), which writes the
# TypeScript types into crates/epiora-import-wasm/bindings.
ts = ["epiora-import/ts"]

[dependencies]
epiora-core = { path = "../epiora-core" }
epiora-import = { path = "../epiora-import" }
# wasm-bindgen is pinned exactly: wasm-pack requires the wasm-bindgen
# CLI to equal the crate version, and CI installs that CLI from a
# SHA-256-verified release tarball. js-sys stays in lockstep with it.
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
serde = "1"
serde-wasm-bindgen = "0.6.5"
# float_roundtrip keeps JSON parsing bit-identical to the native
# import-runner in the parity build (see epiora-core's Cargo.toml).
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
