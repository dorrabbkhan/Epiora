[package]
name = "epiora-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Epiora statistics engine: deterministic, fixture-validated, never panics"

[features]
# The corpus module loads and compares R-generated fixtures; it is used by
# tests and corpus-runner only, never shipped in the wasm binding.
corpus = ["dep:serde_json"]

[dependencies]
libm = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
thiserror = "2"
