[package]
name = "epiora-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Epiora statistics engine: deterministic, fixture-validated, never panics"

[features]
# The corpus module loads, runs and compares R-generated fixtures; it is
# used by tests and corpus-runner only, never shipped in the wasm binding.
corpus = []
# `ts` derives ts_rs::TS on the option, result and receipt types (spec
# §5.1) so crates/epiora-wasm/bindings can be regenerated with
# `cargo test -p epiora-core --features ts export_bindings`.
ts = ["dep:ts-rs"]

[dependencies]
libm = "0.2"
ryu = "1"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: serde_json's default float parser is not correctly
# rounded (it reads "1.0000000000000001e-09", jsonlite's 17-digit form of
# 1e-9, as 9.999999999999999e-10), which would break the exact
# tolerance_classes check and shift every leaf by up to 1 ulp;
# float_roundtrip gives correctly rounded parsing without changing
# serde_json::Number's representation.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
ts-rs = { version = "12.0.1", optional = true, features = ["serde-json-impl"] }

[[bin]]
name = "corpus-runner"
path = "src/bin/corpus-runner.rs"
required-features = ["corpus"]

[dev-dependencies]
proptest = "1"
