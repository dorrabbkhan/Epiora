# Every floating-point function in epiora-core goes through libm (spec
# §3.4, E1): std f64 transcendental methods call platform maths and would
# break bit-identical native/wasm results.
disallowed-methods = [
    { path = "f64::ln", reason = "use libm (spec §3.4)" },
    { path = "f64::ln_1p", reason = "use libm (spec §3.4)" },
    { path = "f64::log", reason = "use libm (spec §3.4)" },
    { path = "f64::log2", reason = "use libm (spec §3.4)" },
    { path = "f64::log10", reason = "use libm (spec §3.4)" },
    { path = "f64::exp", reason = "use libm (spec §3.4)" },
    { path = "f64::exp2", reason = "use libm (spec §3.4)" },
    { path = "f64::exp_m1", reason = "use libm (spec §3.4)" },
    { path = "f64::powf", reason = "use libm (spec §3.4)" },
    { path = "f64::powi", reason = "use libm (spec §3.4)" },
    { path = "f64::sqrt", reason = "use libm (spec §3.4)" },
    { path = "f64::cbrt", reason = "use libm (spec §3.4)" },
    { path = "f64::hypot", reason = "use libm (spec §3.4)" },
    { path = "f64::sin", reason = "use libm (spec §3.4)" },
    { path = "f64::cos", reason = "use libm (spec §3.4)" },
    { path = "f64::tan", reason = "use libm (spec §3.4)" },
    { path = "f64::asin", reason = "use libm (spec §3.4)" },
    { path = "f64::acos", reason = "use libm (spec §3.4)" },
    { path = "f64::atan", reason = "use libm (spec §3.4)" },
    { path = "f64::atan2", reason = "use libm (spec §3.4)" },
    { path = "f64::sinh", reason = "use libm (spec §3.4)" },
    { path = "f64::cosh", reason = "use libm (spec §3.4)" },
    { path = "f64::tanh", reason = "use libm (spec §3.4)" },
    { path = "f64::asinh", reason = "use libm (spec §3.4)" },
    { path = "f64::acosh", reason = "use libm (spec §3.4)" },
    { path = "f64::atanh", reason = "use libm (spec §3.4)" },
    { path = "f64::mul_add", reason = "use libm (spec §3.4)" },
]
