[package]
name = "epiora-lang"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Epi Info language: expression parser, evaluator and function library (v1.1 spec §5.2)"

[features]
# `fuzzing` exposes `recipe_any` for the cargo-fuzz target under fuzz/.
fuzzing = ["dep:arbitrary"]

[dependencies]
arbitrary = { version = "1", optional = true, features = ["derive"] }
epiora-core = { path = "../epiora-core" }
libm = "0.2"
rand_chacha = "0.10"
rand_core = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
epiora-legacy = { path = "../epiora-legacy" }
epiora-mdb = { path = "../epiora-mdb" }
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
