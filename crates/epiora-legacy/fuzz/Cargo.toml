[package]
name = "epiora-legacy-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "AGPL-3.0-only"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.epiora-legacy]
path = ".."
features = ["fuzzing"]

# Use independent workspace for fuzzers
[workspace]
members = ["."]

[[bin]]
name = "legacy_meta_any"
path = "fuzz_targets/legacy_meta_any.rs"
test = false
doc = false
bench = false
