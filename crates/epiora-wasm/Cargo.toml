[package]
name = "epiora-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Epiora engine browser binding: type conversion only (spec §5.1)"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# `parity` adds `runCorpusCase`, which the Node parity run (spec §5.2)
# drives through `parity/run.mjs`. It pulls in epiora-core's corpus
# loader and is compiled into `pkg-parity/` only, never the shipped
# release binding.
parity = ["epiora-core/corpus"]

[dependencies]
epiora-core = { path = "../epiora-core" }
# wasm-bindgen is pinned exactly: wasm-pack requires the wasm-bindgen
# CLI to equal the crate version, and CI installs that CLI from a
# SHA-256-verified release tarball. js-sys stays in lockstep with it.
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
serde = "1"
serde-wasm-bindgen = "0.6.5"
# float_roundtrip keeps fixture parsing bit-identical to the native
# corpus-runner in the parity build (see epiora-core's Cargo.toml).
serde_json = { version = "1", features = ["float_roundtrip"] }
