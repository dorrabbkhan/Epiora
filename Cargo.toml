[workspace]
resolver = "2"
members = ["crates/epiora-core", "crates/epiora-import", "crates/epiora-wasm"]
# crates/epiora-core/fuzz (v0.2 Task 12) and crates/epiora-import/fuzz
# (v0.3 Task 3) use cargo-fuzz on nightly and are never part of the
# stable workspace.
exclude = ["crates/epiora-core/fuzz", "crates/epiora-import/fuzz", "spikes"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-only"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "z"
