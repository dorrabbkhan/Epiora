[workspace]
resolver = "2"
members = [
    "crates/epiora-core",
    "crates/epiora-import",
    "crates/epiora-import-wasm",
    "crates/epiora-lang",
    "crates/epiora-legacy",
    "crates/epiora-mdb",
    "crates/epiora-wasm",
]
# crates/epiora-core/fuzz (v0.2 Task 12), crates/epiora-import/fuzz
# (v0.3 Task 3), crates/epiora-mdb/fuzz (v1.1 Task 5) and
# crates/epiora-lang/fuzz (v1.1 Task 11) use cargo-fuzz on nightly and
# are never part of the stable workspace.
exclude = [
    "crates/epiora-core/fuzz",
    "crates/epiora-import/fuzz",
    "crates/epiora-mdb/fuzz",
    "crates/epiora-lang/fuzz",
    "spikes",
    "app/src-tauri",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-only"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "z"
