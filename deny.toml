# cargo-deny policy for the Epiora engine workspace (plan v0.2 Task 1).
# Licences not on the allow list are denied, as are all advisories.
# The rejected products of platform spec §6 (GADM data, SQLite SEE,
# PowerSync) must never appear in the tree.

[advisories]
version = 2
# Advisory DB lives under target/ (gitignored): check-engine.sh mirrors
# $CARGO_HOME/advisory-dbs into it when one exists (e.g. a read-only
# cargo home), otherwise cargo-deny fetches it there itself.
# EPIORA_DENY_DB overrides for unusual layouts.
db-path = "${EPIORA_DENY_DB:-target/advisory-dbs}"
unmaintained = "all"
unsound = "all"
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSL-1.0",
    "Unicode-3.0",
    "Apache-2.0 WITH LLVM-exception",
    "AGPL-3.0-only",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
