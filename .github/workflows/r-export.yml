name: r-export

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'fixtures/**'
      - 'scripts/r-export/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/r-export.yml'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'fixtures/**'
      - 'scripts/r-export/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/r-export.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  R_VERSION: '4.6.2'
  NODE_VERSION: '22.23.4'
  GIT_SHA: ${{ github.sha }}

# Task 17, spec §8.3: export-corpus writes analysis.R + expected.json
# (+ data.csv) for every corpus fixture and the hostile-text dataset;
# each script runs under the pinned renv and every `EPIORA` line is
# compared to the fixture leaf it names (E7 tolerances) — so the
# verbatim R a user exports is the same text that generated the
# corpus, re-derived and re-checked on every change.
jobs:
  r-export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: ${{ env.R_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # rust-toolchain.toml pins the same version; installed explicitly so
      # the toolchain doesn't drift.
      - name: Install Rust (pinned)
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0

      - name: Restore pinned R packages (renv)
        working-directory: fixtures
        run: Rscript -e 'source("renv/activate.R"); renv::restore(prompt = FALSE)'

      - name: Build export-corpus
        run: cargo build --release -p epiora-core --features corpus --bin export-corpus

      - name: Emit corpus scripts
        run: ./target/release/export-corpus r-export-out

      - name: Run generated R
        run: Rscript scripts/r-export/run.R r-export-out

      - name: Compare to fixture values
        run: node scripts/r-export/compare.mjs r-export-out
