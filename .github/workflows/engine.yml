name: engine

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.*'
      - 'deny.toml'
      - 'rust-toolchain.toml'
      - 'fixtures/**'
      - 'scripts/check*.sh'
      - '.github/workflows/engine.yml'
  workflow_dispatch:

env:
  GIT_SHA: ${{ github.sha }}

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins the same version; installed explicitly so
      # the components are present before any cargo invocation.
      - name: Install Rust 1.99.0 (pinned)
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy rustfmt
          rustup default 1.99.0
          rustc --version
          cargo --version

      - name: Install cargo-deny 0.20.2 (pinned, SHA-256 verified)
        run: |
          curl -sSfLo /tmp/cargo-deny.tar.gz \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo '9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  /tmp/cargo-deny.tar.gz' \
            | sha256sum -c -
          tar -xzf /tmp/cargo-deny.tar.gz -C /tmp
          sudo install -m 0755 /tmp/cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny \
            /usr/local/bin/cargo-deny
          cargo deny --version

      - name: Install bats-core 1.14.0 (pinned, SHA-256 verified)
        run: |
          curl -sSfLo /tmp/bats.tar.gz \
            https://github.com/bats-core/bats-core/archive/refs/tags/v1.14.0.tar.gz
          echo 'bb537b70b15b732f6d8827dd6578e3d8ce166636ce1f18ea9a074184fcce9177  /tmp/bats.tar.gz' \
            | sha256sum -c -
          tar -xzf /tmp/bats.tar.gz -C /tmp
          sudo /tmp/bats-core-1.14.0/install.sh /usr/local
          bats --version

      - name: Engine gate
        run: ./scripts/check-engine.sh full

      - name: Float ban (std f64 methods rejected, libm accepted)
        run: bats scripts/tests/float-ban.bats
