name: engine

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.*'
      - 'deny.toml'
      - 'rust-toolchain.toml'
      - 'fixtures/**'
      - 'scripts/check*.sh'
      - '.github/workflows/engine.yml'
      - '.github/workflows/fuzz-nightly.yml'
  # push to main so a merge touching these paths writes the Rust cache
  # (save-if only writes on main); no job below deploys or publishes.
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.*'
      - 'deny.toml'
      - 'rust-toolchain.toml'
      - 'fixtures/**'
      - 'scripts/check*.sh'
      - '.github/workflows/engine.yml'
      - '.github/workflows/fuzz-nightly.yml'
  workflow_dispatch:

env:
  GIT_SHA: ${{ github.sha }}
  # cargo-deny's advisory DB must live outside every rust-cache path —
  # see app.yml's comment. deny.toml's default target/advisory-dbs is
  # gutted by rust-cache's target cleanup; runner.temp is uncached.
  EPIORA_DENY_DB: ${{ runner.temp }}/advisory-dbs

jobs:
  engine:
    runs-on: ubuntu-latest
    outputs:
      wasm_gzip_bytes: ${{ steps.wasm_size.outputs.bytes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins the same version; installed explicitly so
      # the components are present before any cargo invocation.
      - name: Install Rust 1.99.0 (pinned)
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.99.0
          rustup target add wasm32-unknown-unknown
          rustc --version
          cargo --version

      # Only main writes the cache; PR and dispatch runs restore from it.
      - name: Rust build cache
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: .
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install cargo-deny 0.20.2 (pinned, SHA-256 verified)
        run: |
          curl -sSfLo /tmp/cargo-deny.tar.gz \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo '9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  /tmp/cargo-deny.tar.gz' \
            | sha256sum -c -
          tar -xzf /tmp/cargo-deny.tar.gz -C /tmp
          sudo install -m 0755 /tmp/cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny \
            /usr/local/bin/cargo-deny
          cargo deny --version

      - name: Install bats-core 1.14.0 (pinned, SHA-256 verified)
        run: |
          curl -sSfLo /tmp/bats.tar.gz \
            https://github.com/bats-core/bats-core/archive/refs/tags/v1.14.0.tar.gz
          echo 'bb537b70b15b732f6d8827dd6578e3d8ce166636ce1f18ea9a074184fcce9177  /tmp/bats.tar.gz' \
            | sha256sum -c -
          tar -xzf /tmp/bats.tar.gz -C /tmp
          sudo /tmp/bats-core-1.14.0/install.sh /usr/local
          bats --version

      # wasm-pack requires the wasm-bindgen CLI to equal the locked
      # crate version (0.2.129); it finds this PATH install via `which`
      # under `--mode no-install` instead of downloading a binary.
      - name: Install wasm-bindgen 0.2.129 (pinned, SHA-256 verified)
        run: |
          curl -sSfLo /tmp/wasm-bindgen.tar.gz \
            https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz
          echo '82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e  /tmp/wasm-bindgen.tar.gz' \
            | sha256sum -c -
          tar -xzf /tmp/wasm-bindgen.tar.gz -C /tmp
          sudo install -m 0755 \
            /tmp/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl/wasm-bindgen \
            /usr/local/bin/wasm-bindgen
          wasm-bindgen --version

      - name: Install wasm-pack 0.15.1 (pinned, SHA-256 verified)
        run: |
          curl -sSfLo /tmp/wasm-pack.tar.gz \
            https://github.com/rustwasm/wasm-pack/releases/download/v0.15.1/wasm-pack-v0.15.1-x86_64-unknown-linux-musl.tar.gz
          echo '410101009739b9d01c7d5affaaad6e9c9a24b4cba6791a4805db8e89b9bf7af2  /tmp/wasm-pack.tar.gz' \
            | sha256sum -c -
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          sudo install -m 0755 \
            /tmp/wasm-pack-v0.15.1-x86_64-unknown-linux-musl/wasm-pack \
            /usr/local/bin/wasm-pack
          wasm-pack --version

      - name: Install binaryen version_133 wasm-opt (pinned, SHA-256 verified)
        run: |
          curl -sSfLo /tmp/binaryen.tar.gz \
            https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          echo '2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  /tmp/binaryen.tar.gz' \
            | sha256sum -c -
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          sudo install -m 0755 /tmp/binaryen-version_133/bin/wasm-opt /usr/local/bin/wasm-opt
          wasm-opt --version

      - name: Engine gate
        run: ./scripts/check-engine.sh full

      - name: Float ban (std f64 methods rejected, libm accepted)
        run: bats scripts/tests/float-ban.bats

      - name: Wasm script tests (size gate, parity diff)
        run: bats scripts/tests/wasm-size.bats scripts/tests/parity-diff.bats

      - name: Wasm size in job summary
        id: wasm_size
        if: always()
        run: |
          if [ -f crates/epiora-wasm/pkg/epiora_wasm_bg.wasm ]; then
            size="$(gzip -9 -c crates/epiora-wasm/pkg/epiora_wasm_bg.wasm | wc -c | tr -d ' ')"
            echo "engine .wasm gzip -9 size: **${size} bytes** (budget 409,600)" \
              >> "$GITHUB_STEP_SUMMARY"
            echo "bytes=${size}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload parity lines
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-parity-lines
          path: |
            target/corpus-native.jsonl
            target/corpus-wasm.jsonl
          if-no-files-found: ignore

  # Chromium performance gate (spec §5.3): 1,000,000 rows, seed
  # 20261031, median of 5 runs of datasetFromColumns + stratified
  # tables must be < 1000 ms. A native criterion bench of the same
  # workload runs for reporting only.
  bench:
    runs-on: ubuntu-latest
    outputs:
      median_ms: ${{ steps.bench_summary.outputs.median_ms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.99.0 (pinned)
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          rustup target add wasm32-unknown-unknown
          rustc --version
          cargo --version

      # Only main writes the cache; PR and dispatch runs restore from it.
      - name: Rust build cache
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: .
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # bench.sh runs `npx playwright install --with-deps chromium` under
      # CI; a warm cache makes the browser download a no-op while the
      # system-deps half still runs inside the script. The key gets a
      # `-chromium` suffix: this job installs only chromium, so its
      # saved entry is a subset that must never serve the app job's
      # all-three-browsers key.
      - name: Playwright version (bench lockfile-pinned)
        id: playwright_version
        run: node -p '"version=" + require("./crates/epiora-wasm/bench/package-lock.json").packages["node_modules/playwright-core"].version' >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright_version.outputs.version }}-chromium

      - name: Install wasm-bindgen 0.2.129 (pinned, SHA-256 verified)
        run: |
          curl -sSfLo /tmp/wasm-bindgen.tar.gz \
            https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz
          echo '82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e  /tmp/wasm-bindgen.tar.gz' \
            | sha256sum -c -
          tar -xzf /tmp/wasm-bindgen.tar.gz -C /tmp
          sudo install -m 0755 \
            /tmp/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl/wasm-bindgen \
            /usr/local/bin/wasm-bindgen
          wasm-bindgen --version

      - name: Install wasm-pack 0.15.1 (pinned, SHA-256 verified)
        run: |
          curl -sSfLo /tmp/wasm-pack.tar.gz \
            https://github.com/rustwasm/wasm-pack/releases/download/v0.15.1/wasm-pack-v0.15.1-x86_64-unknown-linux-musl.tar.gz
          echo '410101009739b9d01c7d5affaaad6e9c9a24b4cba6791a4805db8e89b9bf7af2  /tmp/wasm-pack.tar.gz' \
            | sha256sum -c -
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          sudo install -m 0755 \
            /tmp/wasm-pack-v0.15.1-x86_64-unknown-linux-musl/wasm-pack \
            /usr/local/bin/wasm-pack
          wasm-pack --version

      - name: Install binaryen version_133 wasm-opt (pinned, SHA-256 verified)
        run: |
          curl -sSfLo /tmp/binaryen.tar.gz \
            https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          echo '2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  /tmp/binaryen.tar.gz' \
            | sha256sum -c -
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          sudo install -m 0755 /tmp/binaryen-version_133/bin/wasm-opt /usr/local/bin/wasm-opt
          wasm-opt --version

      - name: Chromium performance gate
        run: scripts/bench.sh

      - name: Native criterion bench (report only)
        if: always()
        run: cargo bench -p epiora-core --bench tables_1m 2>&1 | tee target/criterion-tables_1m.txt

      - name: Bench results in job summary
        id: bench_summary
        if: always()
        run: |
          if [ -f crates/epiora-wasm/bench/bench-results.json ]; then
            node -e 'const fs = require("fs");
              const r = require("./crates/epiora-wasm/bench/bench-results.json");
              console.log(`Chromium median: **${r.median_ms.toFixed(1)} ms** (budget < 1000 ms)`);
              console.log(`runs: ${r.runs_ms.map((m) => m.toFixed(1)).join(", ")} ms`);
              console.log(`chromium ${r.chromium_version}, runner ${r.runner}, seed ${r.seed}, rows ${r.rows}`);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `median_ms=${r.median_ms}\n`);' \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f target/criterion-tables_1m.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E 'time:|dataset_new_plus' target/criterion-tables_1m.txt | head -5 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload bench results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: |
            crates/epiora-wasm/bench/bench-results.json
            target/criterion-tables_1m.txt
          if-no-files-found: warn

  # PR fuzzing (spec §6.5): 60 s per target on the dated nightly pinned
  # by crates/epiora-core/fuzz/rust-toolchain.toml. A crash fails the
  # job and its input is committed under fuzz/regressions/ by the fix.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust nightly-2026-10-15 (pinned)
        run: |
          rustup toolchain install nightly-2026-10-15 --profile minimal
          rustup default nightly-2026-10-15
          rustc --version
          cargo --version

      - name: Install cargo-fuzz 0.13.2 (pinned)
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Fuzz each target for 60 s
        run: |
          cd crates/epiora-core/fuzz
          for target in dataset_json dataset_columns freq_any tables_any snapshot_decode; do
            echo "== fuzz $target"
            cargo fuzz run "$target" -- -max_total_time=60
          done
          cd ../../epiora-import/fuzz
          for target in text_import sheet_import diff_any; do
            echo "== fuzz $target"
            cargo fuzz run "$target" -- -max_total_time=60
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: |
            crates/epiora-core/fuzz/artifacts/
            crates/epiora-import/fuzz/artifacts/
          if-no-files-found: ignore

  # Validation report (platform §12.10, v0.2 Task 13): runs the whole
  # corpus through `validation-report` and uploads the Markdown. The
  # artifact of this PR's green run is committed unchanged as
  # docs/validation/v0.2.md. The header's wasm size and bench median
  # come from the engine/bench job outputs, passed to the bin as
  # EPIORA_WASM_GZIP_BYTES / EPIORA_BENCH_MEDIAN_MS.
  validation-report:
    needs: [engine, bench, fuzz]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.99.0 (pinned)
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          rustc --version
          cargo --version

      # Only main writes the cache; PR and dispatch runs restore from it.
      - name: Rust build cache
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: .
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Generate validation report
        env:
          # The report names the PR head commit it describes, not the
          # ephemeral merge commit github.sha carries on pull_request.
          GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EPIORA_WASM_GZIP_BYTES: ${{ needs.engine.outputs.wasm_gzip_bytes }}
          EPIORA_BENCH_MEDIAN_MS: ${{ needs.bench.outputs.median_ms }}
        run: |
          mkdir -p target
          cargo run -p epiora-core --features corpus --bin validation-report -- \
            fixtures "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > target/v0.2.md
          head -15 target/v0.2.md

      - name: Upload validation report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v0.2-validation-md
          path: target/v0.2.md
          if-no-files-found: error
