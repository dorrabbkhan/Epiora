name: desktop

# Desktop builds and smoke test (v0.3 plan Task 15, spec §10.1):
# unsigned Tauri bundles uploaded as artifacts — Linux on every trigger,
# Windows/macOS only on main pushes and manual runs (owner decision
# 2026-11-11) — plus a WebdriverIO smoke test inside the real
# window on Linux (import fixture → TABLES → encrypted-store header
# check). Publishing a release does NOT trigger this workflow: release
# bundles come from the main-push run at the tagged commit
# (docs/releasing.md).
#
# The uploaded bundles are production-shaped: the smoke binary is a
# separate `--no-bundle` rebuild over a VITE_TEST_HOOKS=1 dist, so no
# test hook ships in the artifacts.

on:
  pull_request:
    paths:
      - 'app/**'
      - 'crates/**'
      - 'scripts/desktop-smoke.sh'
      - '.github/workflows/desktop.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'crates/**'
      - 'scripts/desktop-smoke.sh'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  WASM_BINDGEN_VERSION: '0.2.129'
  WASM_PACK_VERSION: '0.15.1'
  BINARYEN_VERSION: 'version_133'

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            smoke: linux
            wasm_bindgen_target: x86_64-unknown-linux-musl
            wasm_bindgen_sha: 82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e
            wasm_pack_target: x86_64-unknown-linux-musl
            wasm_pack_sha: 410101009739b9d01c7d5affaaad6e9c9a24b4cba6791a4805db8e89b9bf7af2
            binaryen_target: x86_64-linux
            binaryen_sha: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
          - os: windows-latest
            smoke: none
            wasm_bindgen_target: x86_64-pc-windows-msvc
            wasm_bindgen_sha: 79e348c169d0c10c0b287647f1e753d0985353ca96800bc29be8f4261baf13e6
            wasm_pack_target: x86_64-pc-windows-msvc
            wasm_pack_sha: 80afe1f95aaa3f7442917c4457c8316bd1a383c1f27eb0e40601ff3ee3217583
            binaryen_target: x86_64-windows
            binaryen_sha: 17a2cbeac6b5693c5fbafab3838d3c65fd9c1eb38b05f5baec6c657e8c84995b
          - os: macos-latest
            smoke: none
            wasm_bindgen_target: aarch64-apple-darwin
            wasm_bindgen_sha: 81d4a23d56b3c3eb8187658329116d50e0b228a93b343825fb71f70179051cd1
            wasm_pack_target: aarch64-apple-darwin
            wasm_pack_sha: bcaf2a418ae39c874b072ea122fec58e11970862cbd8fd4eca2f00a17f76c536
            binaryen_target: arm64-macos
            binaryen_sha: ad66da82ac13f163e424b1643f16c6dfcccc98b5966296b43e52d3cab04f84a8
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    # Windows/macOS bundle legs only do work on main pushes and manual
    # runs (owner decision 2026-11-11): a job-level `if` cannot
    # read the matrix (it is evaluated before the matrix expands), so
    # this per-leg flag skips every step on PRs for the non-ubuntu legs —
    # each leg is a fast no-op success whose log shows every step
    # skipped, and PRs keep the ubuntu bundle + Linux smoke.
    env:
      RUN_BUNDLE: ${{ matrix.os == 'ubuntu-24.04' || github.event_name != 'pull_request' }}
    steps:
      - if: env.RUN_BUNDLE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: env.RUN_BUNDLE == 'true'
        name: Install Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - if: env.RUN_BUNDLE == 'true'
        name: Install app dependencies
        run: npm ci
        working-directory: app

      - if: env.RUN_BUNDLE == 'true'
        name: Install Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          rustup target add wasm32-unknown-unknown
          rustc --version

      # Only main writes the cache; PR and dispatch runs restore from it.
      # Covers both workspaces: target/ for the wasm builds and
      # app/src-tauri/target/ for the tauri build.
      - if: env.RUN_BUNDLE == 'true'
        name: Rust build cache
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: |
            .
            app/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Same pinned, SHA-256-verified tool triplet as app.yml; here the
      # verified binaries land in target/bin, which wasm-build.sh
      # prefers over PATH tools on every OS.
      - if: env.RUN_BUNDLE == 'true'
        name: Install wasm tools (SHA-256 verified)
        run: |
          set -euo pipefail
          sha_of() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | cut -d' ' -f1
            else
              shasum -a 256 "$1" | cut -d' ' -f1
            fi
          }
          verify() {
            actual="$(sha_of "$1")"
            [ "$actual" = "$2" ] || {
              echo "sha256 mismatch for $1: $actual (want $2)" >&2
              exit 1
            }
          }
          tools="$PWD/target/bin"
          libdir="$PWD/target/lib"
          mkdir -p "$tools" "$libdir" dl
          cd dl
          curl -sSfLo wb.tar.gz \
            "https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-${{ matrix.wasm_bindgen_target }}.tar.gz"
          verify wb.tar.gz "${{ matrix.wasm_bindgen_sha }}"
          curl -sSfLo wp.tar.gz \
            "https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/wasm-pack-v${WASM_PACK_VERSION}-${{ matrix.wasm_pack_target }}.tar.gz"
          verify wp.tar.gz "${{ matrix.wasm_pack_sha }}"
          curl -sSfLo be.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-${{ matrix.binaryen_target }}.tar.gz"
          verify be.tar.gz "${{ matrix.binaryen_sha }}"
          tar -xzf wb.tar.gz -C "$tools" --strip-components=1
          tar -xzf wp.tar.gz -C "$tools" --strip-components=1
          tar -xzf be.tar.gz -C "$tools" --strip-components=2 \
            "binaryen-${BINARYEN_VERSION}/bin/"
          # macOS wasm-opt links @rpath/libbinaryen.dylib with rpath
          # @loader_path/../lib — lib/ must sit beside bin/.
          tar -xzf be.tar.gz -C "$libdir" --strip-components=2 \
            "binaryen-${BINARYEN_VERSION}/lib/"
          cd ..
          rm -rf dl
          export PATH="$tools:$PATH"
          wasm-bindgen --version
          wasm-pack --version
          wasm-opt --version

      - name: Install Tauri Linux build deps
        if: env.RUN_BUNDLE == 'true' && matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libdbus-1-dev pkg-config

      # The pkg outputs are fully determined by the key's inputs — crate
      # sources, lockfile, toolchain, build script and the pinned tool
      # triplet (no GIT_SHA in this workflow) — so a hit restores the
      # identical files and the build is skipped.
      - if: env.RUN_BUNDLE == 'true'
        name: Cache wasm packages
        id: wasm_packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            crates/epiora-wasm/pkg
            crates/epiora-import-wasm/pkg
          key: >-
            ${{ runner.os }}-wasm-pkg-wbindgen${{ env.WASM_BINDGEN_VERSION }}-wpack${{ env.WASM_PACK_VERSION }}-${{ env.BINARYEN_VERSION }}-${{ hashFiles('crates/**', 'Cargo.lock', 'rust-toolchain.toml', 'scripts/wasm-build.sh') }}

      - name: Build the two wasm packages
        if: env.RUN_BUNDLE == 'true' && steps.wasm_packages.outputs.cache-hit != 'true'
        run: |
          scripts/wasm-build.sh release epiora-wasm
          scripts/wasm-build.sh release epiora-import-wasm

      - if: env.RUN_BUNDLE == 'true'
        name: Build app dist
        run: npm run build
        working-directory: app

      - if: env.RUN_BUNDLE == 'true'
        name: tauri build (unsigned)
        run: npx tauri build
        working-directory: app

      - if: env.RUN_BUNDLE == 'true'
        name: Upload bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: epiora-desktop-${{ matrix.os }}-${{ github.sha }}
          path: app/src-tauri/target/release/bundle/
          if-no-files-found: error

      # The smoke binary runs the test-hooks dist — a no-bundle rebuild,
      # so the uploaded bundles stay free of VITE_TEST_HOOKS.
      - name: Build test-hooks dist
        if: env.RUN_BUNDLE == 'true' && matrix.smoke != 'none'
        run: npm run build
        working-directory: app
        env:
          VITE_TEST_HOOKS: '1'

      - name: Build smoke binary (no bundling)
        if: env.RUN_BUNDLE == 'true' && matrix.smoke != 'none'
        run: npx tauri build --no-bundle
        working-directory: app

      - name: Linux smoke test (webkit2gtk-driver + xvfb + gnome-keyring)
        if: env.RUN_BUNDLE == 'true' && matrix.smoke == 'linux'
        run: scripts/desktop-smoke.sh

      # Windows smoke (plan Step 3) was attempted twice and removed:
      # msedgedriver cannot create a WebView2 session on the
      # windows-latest image ("DevToolsActivePort file doesn't exist",
      # also with --no-sandbox). Reason and run links: docs/decisions.md
      # under v0.3 Task 15.
