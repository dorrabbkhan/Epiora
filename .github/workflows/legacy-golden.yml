name: legacy-golden

# v1.1 Task 4 (spec §8.2): produce the golden imports for every
# fixtures/legacy/samples project with native mdbtools / sqlite3 dumps
# (independent of epiora-legacy), verify the verbatim Access→SQLite
# copies produce the same golden, run the golden unit tests, prove a
# second run is byte-identical, and upload fixtures/legacy/golden/ as
# the artifact that gets committed.
#
# GitHub registers `workflow_dispatch` handlers only for workflow files
# on the default branch, so the producing run for a brand-new workflow
# is fired by the `push` trigger below (scoped to v1.1 task branches
# that touch the fixture surface). After merge, `workflow_dispatch`
# regenerates the same artifact on demand.

on:
  push:
    branches:
      - 'v1.1/**'
    paths:
      - '.github/workflows/legacy-golden.yml'
      - 'fixtures/legacy/**'
      - 'fixtures/schema/**'
  workflow_dispatch:

env:
  NODE_VERSION: '22.23.4'
  MDB_VERSION: '1.0.1'
  MDB_SHA256: 'ff9c425a88bc20bf9318a332eec50b17e77896eef65a0e69415ccb4e396d1812'
  # Upstream mdb-export binds text/MEMO columns at EXPORT_BIND_SIZE =
  # 200000 (src/util/mdb-export.c), silently truncating every value
  # over 199,999 bytes (HansensDisease's HDCaseForm CheckCode lost 27
  # blocks). The golden oracle is rebuilt below at the product
  # reader's bind size (4 * 1024 * 1024, crates/epiora-mdb/c/harness.c).
  EXPORT_BIND_SIZE: '4194304'

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install mdbtools and sqlite3 from apt (record versions)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mdbtools sqlite3
          apt-cache policy mdbtools sqlite3 | grep -E 'Installed|mdbtools|sqlite3'
          mdb-ver --version || true
          sqlite3 --version

      # mdb-export is rebuilt from the upstream release tarball (pinned
      # URL + SHA-256, licence read from the tarball itself) with
      # EXPORT_BIND_SIZE patched up to 4 MiB; MDB_EXPORT points every
      # golden script (legacy-read.mjs via golden.mjs, copy-tables.mjs
      # and golden.test.mjs) at it. mdb-tables/mdb-schema/mdb-ver keep
      # coming from apt — they do not bind column data.
      - name: Build mdb-export at EXPORT_BIND_SIZE=4194304 (pinned tarball)
        run: |
          curl -sSL -o "$RUNNER_TEMP/mdbtools-$MDB_VERSION.tar.gz" \
            "https://github.com/mdbtools/mdbtools/releases/download/v$MDB_VERSION/mdbtools-$MDB_VERSION.tar.gz"
          echo "$MDB_SHA256  $RUNNER_TEMP/mdbtools-$MDB_VERSION.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/mdbtools-$MDB_VERSION.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/mdbtools-$MDB_VERSION"
          sed -i "s/^#define EXPORT_BIND_SIZE 200000/#define EXPORT_BIND_SIZE $EXPORT_BIND_SIZE/" src/util/mdb-export.c
          grep -n 'define EXPORT_BIND_SIZE' src/util/mdb-export.c
          ./configure --disable-glib --disable-man
          make -C src -j"$(nproc)"
          head -3 COPYING; head -3 COPYING.LIB
          src/util/mdb-export --version || true
          echo "MDB_EXPORT=$RUNNER_TEMP/mdbtools-$MDB_VERSION/src/util/mdb-export" >> "$GITHUB_ENV"

      - name: Install validator tooling (npm ci, lockfile-pinned)
        working-directory: fixtures/tools
        run: npm ci

      - name: Produce the golden imports
        run: node fixtures/legacy/golden.mjs --samples fixtures/legacy/samples --out fixtures/legacy/golden

      - name: Produce the reimport copy and its golden
        run: node fixtures/legacy/golden.mjs --reimport --samples fixtures/legacy/samples --out fixtures/legacy/golden/reimport

      - name: Run the golden unit tests
        run: node --test "fixtures/legacy/*.test.mjs"

      - name: Validate every produced document against the schemas
        run: |
          set -e
          find fixtures/legacy/golden -name project.json | while read -r f; do
            fixtures/tools/node_modules/.bin/ajv validate -s fixtures/schema/legacy-project.schema.json -d "$f" || exit 1
          done
          find fixtures/legacy/golden -name '*.dataset.json' | while read -r f; do
            fixtures/tools/node_modules/.bin/ajv validate -s fixtures/schema/dataset.schema.json -d "$f" || exit 1
          done

      - name: Verify Access→SQLite copies produce the same golden
        run: |
          set -e
          # EI7 only: Epi Info 3 is Access-only (its JET3 code-page
          # assumption has no SQLite counterpart), while every EI7
          # project must golden identically under both backends.
          find fixtures/legacy/samples/ei7 -name '*.mdb' | sort | while read -r f; do
            rel="${f#fixtures/legacy/samples/ei7/}"
            copy="/tmp/copies/${rel%.mdb}.db"
            out="/tmp/copy-golden/${rel%.mdb}"
            mkdir -p "$(dirname "$copy")"
            node fixtures/legacy/copy-tables.mjs --mdb "$f" --sqlite "$copy"
            node fixtures/legacy/golden.mjs --db "$copy" --out "$out"
            orig="fixtures/legacy/golden/ei7/${rel%.mdb}"
            node fixtures/legacy/compare-golden.mjs --a "$orig" --b "$out" || { echo "cross-backend mismatch: $rel"; exit 1; }
          done

      - name: Prove a second run produces no diff
        run: |
          node fixtures/legacy/golden.mjs --samples fixtures/legacy/samples --out /tmp/golden-run2
          node fixtures/legacy/golden.mjs --reimport --samples fixtures/legacy/samples --out /tmp/reimport-run2
          diff -r fixtures/legacy/golden/ei7 /tmp/golden-run2/ei7
          diff -r fixtures/legacy/golden/ei3 /tmp/golden-run2/ei3
          diff -r fixtures/legacy/golden/reimport /tmp/reimport-run2 -x expected-diff.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legacy-golden
          path: fixtures/legacy/golden/
