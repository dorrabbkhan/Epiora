name: spike-fixtures

on:
  pull_request:
    paths:
      - 'fixtures/**'
      - '.github/workflows/spike-fixtures.yml'
  workflow_dispatch:

env:
  R_VERSION: '4.5.2'
  NODE_VERSION: '22.23.4'

jobs:
  fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: ${{ env.R_VERSION }}

      - name: Restore pinned R packages (renv)
        working-directory: fixtures
        run: Rscript -e 'source("renv/activate.R"); renv::restore(prompt = FALSE)'

      - name: Regenerate fixtures
        run: Rscript fixtures/generate.R

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install validator tooling (npm ci, lockfile-pinned)
        working-directory: fixtures/tools
        run: npm ci

      - name: Validate fixtures against schema
        run: |
          mapfile -d '' files < <(
            find fixtures \( -path fixtures/renv -o -path fixtures/schema -o -path fixtures/tools \) -prune \
              -o -name '*.json' -print0
          )
          echo "fixture JSON files found: ${#files[@]}"
          printf '  %s\n' "${files[@]}"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "ERROR: no fixture JSON files found; refusing to pass vacuously" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            fixtures/tools/node_modules/.bin/ajv validate \
              -s fixtures/schema/fixture.schema.json -d "$f"
          done

      - name: No fixture drift after regeneration
        run: |
          git diff --exit-code fixtures/
          status="$(git status --porcelain --untracked-files=all -- fixtures/)"
          if [ -n "$status" ]; then
            echo "ERROR: regeneration left uncommitted changes under fixtures/:" >&2
            echo "$status" >&2
            exit 1
          fi
