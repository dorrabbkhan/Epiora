name: spike-fixtures

on:
  pull_request:
    paths:
      - 'fixtures/**'
      - '.github/workflows/spike-fixtures.yml'
  workflow_dispatch:

env:
  R_VERSION: '4.5.2'
  NODE_VERSION: '22.23.4'
  AJV_CLI_VERSION: '5.0.0'
  # npm tarball https://registry.npmjs.org/ajv-cli/-/ajv-cli-5.0.0.tgz
  AJV_CLI_SHA256: 'd5bec37d30a8ed0add0ee1c63bb2b6e3ea279124e1a615b0a7806fe089963737'

jobs:
  fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: ${{ env.R_VERSION }}

      - name: Restore pinned R packages (renv)
        working-directory: fixtures
        run: Rscript -e 'source("renv/activate.R"); renv::restore(prompt = FALSE)'

      - name: Regenerate fixtures
        run: Rscript fixtures/generate.R

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install ajv-cli (pinned version + SHA-256)
        run: |
          url="https://registry.npmjs.org/ajv-cli/-/ajv-cli-$AJV_CLI_VERSION.tgz"
          curl -sSfLo "$RUNNER_TEMP/ajv-cli-$AJV_CLI_VERSION.tgz" "$url"
          echo "$AJV_CLI_SHA256  $RUNNER_TEMP/ajv-cli-$AJV_CLI_VERSION.tgz" | sha256sum -c -
          npm install -g "$RUNNER_TEMP/ajv-cli-$AJV_CLI_VERSION.tgz"

      - name: Validate fixtures against schema
        run: |
          find fixtures \( -path fixtures/renv -o -path fixtures/schema \) -prune \
            -o -name '*.json' -print0 \
            | xargs -0 -r -n1 ajv validate -s fixtures/schema/fixture.schema.json -d

      - name: No fixture drift after regeneration
        run: git diff --exit-code fixtures/
