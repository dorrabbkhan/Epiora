name: spike-tauri

on:
  pull_request:
    paths:
      - 'spikes/tauri-shell/**'
      - '.github/workflows/spike-tauri.yml'
      - 'scripts/check.sh'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rust toolchain + Android/wasm targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android, wasm32-unknown-unknown

      - name: Install spike dependencies (npm ci)
        working-directory: spikes/tauri-shell
        run: npm ci

      - name: Build stats wasm module
        working-directory: spikes/tauri-shell
        run: npm run build:wasm

      - name: Android toolchain versions
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME"
          ls "$ANDROID_HOME/ndk" 2>/dev/null || true
          rustc --version
          java -version 2>&1 | head -1

      - name: tauri android init
        working-directory: spikes/tauri-shell
        run: npx tauri android init

      - name: tauri android build (debug APK, x86_64)
        working-directory: spikes/tauri-shell
        # ANDROID_NDK_LATEST_HOME is set by the ubuntu runner image;
        # cargo-mobile2 also looks for NDK under $ANDROID_HOME/ndk.
        run: |
          export NDK_HOME="${NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          echo "NDK_HOME=$NDK_HOME"
          npx tauri android build --debug --apk --target x86_64

      - name: Record APK size
        working-directory: spikes/tauri-shell
        run: |
          find src-tauri/gen/android -name '*.apk' -exec ls -l {} +
          find src-tauri/gen/android -name '*.apk' -exec du -h {} + | tee apk-size.txt

      # GitHub's ubuntu runners expose /dev/kvm but the action user lacks
      # access; without this the emulator runs with `-accel off` and an
      # x86_64 system image never finishes booting (seen in run 40970658633).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # Manual emulator run (android-emulator-runner hides the emulator's
      # own output, which made run 40970658633/40972949756 undebuggable);
      # emulator.log is cat'ed at the end whatever happens.
      - name: Create AVD
        run: |
          SDKTOOLS="$ANDROID_HOME/cmdline-tools/latest/bin"
          "$SDKTOOLS/sdkmanager" --install 'system-images;android-34;default;x86_64' 'emulator' 'platform-tools'
          echo no | "$SDKTOOLS/avdmanager" create avd --force -n test --package 'system-images;android-34;default;x86_64'

      - name: Run on emulator and check RR = 5.57
        run: |
          set -x
          "$ANDROID_HOME/emulator/emulator" -port 5554 -avd test -accel on \
            -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio \
            -no-boot-anim -camera-access none > emulator.log 2>&1 &
          EMU_PID=$!
          booted=0
          for i in $(seq 1 90); do
            if adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | grep -q 1; then
              booted=1; break
            fi
            if ! kill -0 "$EMU_PID" 2>/dev/null; then echo "emulator process died"; break; fi
            sleep 5
          done
          echo "booted=$booted"
          if [ "$booted" != 1 ]; then tail -50 emulator.log; exit 1; fi
          APK=$(find spikes/tauri-shell/src-tauri/gen/android -name '*.apk' | head -1)
          echo "Installing $APK"
          adb -s emulator-5554 install -r "$APK"
          adb -s emulator-5554 shell monkey -p com.epiora.spike -c android.intent.category.LAUNCHER 1
          ok=0
          for i in $(seq 1 30); do
            adb -s emulator-5554 shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true
            adb -s emulator-5554 pull /sdcard/ui.xml ui.xml >/dev/null 2>&1 || true
            if grep -q 'RR = 5.57' ui.xml 2>/dev/null; then ok=1; break; fi
            sleep 2
          done
          echo "uiautomator texts:"; grep -o 'text="[^"]*"' ui.xml 2>/dev/null | head -10 || true
          tail -30 emulator.log
          if [ "$ok" != 1 ]; then echo "RR = 5.57 not found in UI"; head -50 ui.xml; exit 1; fi
          echo "FOUND: RR = 5.57"

      - name: Upload APK and UI dump
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tauri-android
          path: |
            spikes/tauri-shell/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            ui.xml
            emulator.log
            spikes/tauri-shell/apk-size.txt
          retention-days: 30
          if-no-files-found: warn

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rust toolchain + iOS-sim/wasm targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim, wasm32-unknown-unknown

      - name: Install spike dependencies (npm ci)
        working-directory: spikes/tauri-shell
        run: npm ci

      - name: Build stats wasm module
        working-directory: spikes/tauri-shell
        run: npm run build:wasm

      - name: Xcode + toolchain versions
        run: |
          xcodebuild -version
          rustc --version

      - name: tauri ios init
        working-directory: spikes/tauri-shell
        run: npx tauri ios init

      - name: tauri ios build (debug, aarch64-sim)
        working-directory: spikes/tauri-shell
        run: npx tauri ios build --debug --target aarch64-sim

      - name: Launch on iOS simulator
        working-directory: spikes/tauri-shell
        run: |
          APP=$(find src-tauri/gen/apple -name '*.app' -path '*iphonesimulator*' | head -1)
          if [ -z "$APP" ]; then APP=$(find src-tauri/gen/apple -name '*.app' | head -1); fi
          echo "App bundle: $APP"
          test -n "$APP"
          DEV=$(xcrun simctl create "epiora-spike" "iPhone 15" 2>/dev/null || xcrun simctl create "epiora-spike" "com.apple.CoreSimulator.SimDeviceType.iPhone-15" "com.apple.CoreSimulator.SimRuntime.iOS-17-5")
          echo "Simulator: $DEV"
          xcrun simctl boot "$DEV" || true
          sleep 5
          xcrun simctl install "$DEV" "$APP"
          LAUNCH_OUT=$(xcrun simctl launch "$DEV" com.epiora.spike 2>&1) || true
          echo "$LAUNCH_OUT"
          echo "$LAUNCH_OUT" | grep -q 'com.epiora.spike'
