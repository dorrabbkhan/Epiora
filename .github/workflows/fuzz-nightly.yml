name: fuzz-nightly

# Nightly fuzzing (spec §6.5): 1800 s per target at 02:00 UTC on the
# dated nightly pinned by crates/epiora-core/fuzz/rust-toolchain.toml.
# A crash fails the job and uploads fuzz/artifacts/; the fix commits the
# crash input under fuzz/regressions/<target>/ so
# tests/fuzz_regressions.rs replays it forever.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  GIT_SHA: ${{ github.sha }}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [dataset_json, dataset_columns, freq_any, tables_any, snapshot_decode]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust nightly-2026-10-15 (pinned)
        run: |
          rustup toolchain install nightly-2026-10-15 --profile minimal
          rustup default nightly-2026-10-15
          rustc --version
          cargo --version

      - name: Install cargo-fuzz 0.13.2 (pinned)
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Fuzz ${{ matrix.target }} for 1800 s
        run: |
          cd crates/epiora-core/fuzz
          cargo fuzz run "${{ matrix.target }}" -- -max_total_time=1800

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: crates/epiora-core/fuzz/artifacts/
          if-no-files-found: ignore
