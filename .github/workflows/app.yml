name: app

# The app gate (v0.3 spec §10.1): strict typecheck, ESLint, Stylelint,
# token regeneration check, Vitest (units, contrast, lint rules),
# licence check, vite build and Playwright on all three engines.

on:
  pull_request:
    paths:
      - 'app/**'
      - 'crates/**'
      - 'scripts/check-app.sh'
      - 'scripts/check.sh'
      - '.github/workflows/app.yml'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      # Release runs the gate against the tagged tree, not main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

      - name: Install Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # npm ci must run before the browser install: with no
      # node_modules, npx fetches the latest playwright and installs
      # browser revisions the lockfile-pinned version cannot launch.
      - name: Install app dependencies
        run: npm ci
        working-directory: app

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: app

      # check-app.sh builds both wasm packages first (Task 9), so the
      # app job needs the same pinned toolchain as engine.yml.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.99.0
          rustup target add wasm32-unknown-unknown
          rustc --version

      - name: Install wasm-bindgen 0.2.129 (pinned, SHA-256 verified)
        run: |
          curl -sSfLo /tmp/wasm-bindgen.tar.gz \
            https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz
          echo '82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e  /tmp/wasm-bindgen.tar.gz' \
            | sha256sum -c -
          tar -xzf /tmp/wasm-bindgen.tar.gz -C /tmp
          sudo install -m 0755 \
            /tmp/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl/wasm-bindgen \
            /usr/local/bin/wasm-bindgen
          wasm-bindgen --version

      - name: Install wasm-pack 0.15.1 (pinned, SHA-256 verified)
        run: |
          curl -sSfLo /tmp/wasm-pack.tar.gz \
            https://github.com/rustwasm/wasm-pack/releases/download/v0.15.1/wasm-pack-v0.15.1-x86_64-unknown-linux-musl.tar.gz
          echo '410101009739b9d01c7d5affaaad6e9c9a24b4cba6791a4805db8e89b9bf7af2  /tmp/wasm-pack.tar.gz' \
            | sha256sum -c -
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          sudo install -m 0755 \
            /tmp/wasm-pack-v0.15.1-x86_64-unknown-linux-musl/wasm-pack \
            /usr/local/bin/wasm-pack
          wasm-pack --version

      - name: Install binaryen version_133 wasm-opt (pinned, SHA-256 verified)
        run: |
          curl -sSfLo /tmp/binaryen.tar.gz \
            https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          echo '2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  /tmp/binaryen.tar.gz' \
            | sha256sum -c -
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          sudo install -m 0755 /tmp/binaryen-version_133/bin/wasm-opt /usr/local/bin/wasm-opt
          wasm-opt --version

      - name: check-app.sh full
        run: scripts/check-app.sh full

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: app/playwright-report/
          if-no-files-found: ignore

      # Netlify deploys (v0.3 spec §7.2; owner's Step 5 change on PR #49):
      # production deploys happen only on a published release, never on
      # pushes to main. Same-repo PRs get an `pr-<number>` alias preview,
      # manual runs a branch-name alias preview. Every step below only
      # runs after every gate above has passed, and never on fork PRs
      # (secrets stay env-only, so a fork would have no token anyway).

      - name: Build production dist
        if: >-
          github.event_name == 'release' || github.event_name == 'workflow_dispatch' ||
          github.event.pull_request.head.repo.full_name == github.repository
        # check-app.sh built dist with VITE_TEST_HOOKS=1 for the e2e
        # suite; the deploy must ship a fresh build without it.
        run: env -u VITE_TEST_HOOKS npm run build
        working-directory: app

      - name: Assert no test hooks in the deploy build
        if: >-
          github.event_name == 'release' || github.event_name == 'workflow_dispatch' ||
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          # A VITE_TEST_HOOKS=1 build compiles the __simulateQuotaOnNextWrite
          # guard out of the worker bundle, so its rejection message is a
          # canary that must be present; the flag's own identifier must
          # never ship at all.
          if ! grep -rqs 'test hooks are disabled' dist; then
            echo 'FAIL: dist is missing the test-hook guard — it was built with VITE_TEST_HOOKS=1' >&2
            exit 1
          fi
          if grep -rqs 'VITE_TEST_HOOKS' dist; then
            echo 'FAIL: dist contains the VITE_TEST_HOOKS identifier' >&2
            exit 1
          fi
        working-directory: app

      - name: Deploy preview (pull request)
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx netlify deploy --dir dist --alias "pr-${{ github.event.pull_request.number }}" --json > deploy.json
          url="$(node -p 'JSON.parse(require("fs").readFileSync("deploy.json", "utf8")).deploy_url')"
          echo "Deploy preview: ${url}" >> "$GITHUB_STEP_SUMMARY"
        working-directory: app

      - name: Deploy preview (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          alias="$(printf '%s' "${GITHUB_REF_NAME}" \
            | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-' | cut -c1-37 | sed 's/^-*//; s/-*$//')"
          npx netlify deploy --dir dist --alias "${alias}" --json > deploy.json
          url="$(node -p 'JSON.parse(require("fs").readFileSync("deploy.json", "utf8")).deploy_url')"
          echo "Deploy preview (${alias}): ${url}" >> "$GITHUB_STEP_SUMMARY"
        working-directory: app

      - name: Deploy production (release published)
        if: github.event_name == 'release'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx netlify deploy --dir dist --prod --json > deploy.json
          url="$(node -p 'JSON.parse(require("fs").readFileSync("deploy.json", "utf8")).deploy_url')"
          echo "Production deploy: ${url}" >> "$GITHUB_STEP_SUMMARY"
        working-directory: app
