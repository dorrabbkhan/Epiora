name: app

# The app gate (v0.3 spec §10.1): strict typecheck, ESLint, Stylelint,
# token regeneration check, Vitest (units, contrast, lint rules),
# licence check, vite build and Playwright on all three engines.

on:
  pull_request:
    paths:
      - 'app/**'
      - 'crates/**'
      - 'scripts/check-app.sh'
      - 'scripts/check.sh'
      - '.github/workflows/app.yml'
  # push to main so a merge touching these paths writes the Rust cache
  # (save-if only writes on main); nothing below deploys on push.
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'crates/**'
      - 'scripts/check-app.sh'
      - 'scripts/check.sh'
      - '.github/workflows/app.yml'
  workflow_dispatch:
    inputs:
      runs:
        description: 'perf job: samples per scenario'
        required: false
        type: number
        default: 10
      rows:
        description: 'perf job: rows in the big CSV (diagnosis aid)'
        required: false
        type: number
        default: 1000000
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Task 14: the native store side of the app gate — cargo deny, the
  # src-tauri workspace tests (incl. keystore), and the TypeScript
  # conformance suite against store-stdio.
  native-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tauri Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libdbus-1-dev pkg-config

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          rustc --version

      # Only main writes the cache; PR and dispatch runs restore from it.
      # This job compiles only the app/src-tauri workspace.
      - name: Rust build cache
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: app/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-deny 0.20.2 (pinned, SHA-256 verified)
        run: |
          curl -sSfLo /tmp/cargo-deny.tar.gz \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo '9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  /tmp/cargo-deny.tar.gz' \
            | sha256sum -c -
          tar -xzf /tmp/cargo-deny.tar.gz -C /tmp
          sudo install -m 0755 /tmp/cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny \
            /usr/local/bin/cargo-deny
          cargo deny --version

      # generate_context!() embeds frontendDist at build time; a stub
      # keeps `cargo test` independent of the vite build.
      - name: Stub app/dist for codegen
        run: |
          mkdir -p app/dist
          echo '<!doctype html><title>codegen stub</title>' > app/dist/index.html

      # cargo-deny's advisory DB must live outside every rust-cache
      # path. deny.toml's default is <workspace>/target/advisory-dbs,
      # but rust-cache's pre-save cleanup deletes every file under
      # target/ outside cargo profile dirs — it gutted the cached DB
      # clone and restored empty dirs, so cargo-deny failed with
      # "failed to load any advisories in the database" (run
      # 43101947021). runner.temp is uncached and always fresh. The
      # runner context exists only in step env, so this can't sit in
      # workflow- or job-level env.
      - name: cargo deny check
        run: cargo deny check
        working-directory: app/src-tauri
        env:
          EPIORA_DENY_DB: ${{ runner.temp }}/advisory-dbs

      - name: cargo test (src-tauri workspace)
        run: cargo test --workspace
        working-directory: app/src-tauri

      - name: Build store-stdio
        run: cargo build -p epiora-store-native --features stdio
        working-directory: app/src-tauri

      - name: Install app dependencies
        run: npm ci
        working-directory: app

      - name: Native conformance suite
        run: npx vitest run src/store/conformance/native.test.ts
        working-directory: app

  app:
    runs-on: ubuntu-latest
    steps:
      # Release runs the gate against the tagged tree, not main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

      - name: Install Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # npm ci must run before the browser install: with no
      # node_modules, npx fetches the latest playwright and installs
      # browser revisions the lockfile-pinned version cannot launch.
      - name: Install app dependencies
        run: npm ci
        working-directory: app

      - name: Playwright version (lockfile-pinned)
        id: playwright_version
        run: node -p '"version=" + require("./app/package-lock.json").packages["node_modules/playwright-core"].version' >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright_version.outputs.version }}

      # Runs unconditionally: on a cache hit the download half verifies
      # the binaries (~2 s) and tops up anything missing; the system-deps
      # half always installs. This also self-heals a partial entry (a
      # job that caches a browser subset — see the bench job's separate
      # chromium-only key).
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: app

      # check-app.sh builds both wasm packages first (Task 9), so the
      # app job needs the same pinned toolchain as engine.yml.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.99.0
          rustup target add wasm32-unknown-unknown
          rustc --version

      # Only main writes the cache; PR and release runs restore from it.
      # check-app.sh compiles both workspaces: target/ for the wasm
      # builds and app/src-tauri/target/ for the store-stdio build.
      - name: Rust build cache
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: |
            .
            app/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install wasm-bindgen 0.2.129 (pinned, SHA-256 verified)
        run: |
          curl -sSfLo /tmp/wasm-bindgen.tar.gz \
            https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz
          echo '82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e  /tmp/wasm-bindgen.tar.gz' \
            | sha256sum -c -
          tar -xzf /tmp/wasm-bindgen.tar.gz -C /tmp
          sudo install -m 0755 \
            /tmp/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl/wasm-bindgen \
            /usr/local/bin/wasm-bindgen
          wasm-bindgen --version

      - name: Install wasm-pack 0.15.1 (pinned, SHA-256 verified)
        run: |
          curl -sSfLo /tmp/wasm-pack.tar.gz \
            https://github.com/rustwasm/wasm-pack/releases/download/v0.15.1/wasm-pack-v0.15.1-x86_64-unknown-linux-musl.tar.gz
          echo '410101009739b9d01c7d5affaaad6e9c9a24b4cba6791a4805db8e89b9bf7af2  /tmp/wasm-pack.tar.gz' \
            | sha256sum -c -
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          sudo install -m 0755 \
            /tmp/wasm-pack-v0.15.1-x86_64-unknown-linux-musl/wasm-pack \
            /usr/local/bin/wasm-pack
          wasm-pack --version

      - name: Install binaryen version_133 wasm-opt (pinned, SHA-256 verified)
        run: |
          curl -sSfLo /tmp/binaryen.tar.gz \
            https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          echo '2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  /tmp/binaryen.tar.gz' \
            | sha256sum -c -
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          sudo install -m 0755 /tmp/binaryen-version_133/bin/wasm-opt /usr/local/bin/wasm-opt
          wasm-opt --version

      - name: Install cargo-deny 0.20.2 (pinned, SHA-256 verified)
        run: |
          curl -sSfLo /tmp/cargo-deny.tar.gz \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo '9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  /tmp/cargo-deny.tar.gz' \
            | sha256sum -c -
          tar -xzf /tmp/cargo-deny.tar.gz -C /tmp
          sudo install -m 0755 /tmp/cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny \
            /usr/local/bin/cargo-deny
          cargo deny --version

      # EPIORA_DENY_DB: same as native-store above — check-app.sh runs
      # `cargo deny check` inside app/src-tauri.
      - name: check-app.sh full
        run: scripts/check-app.sh full
        env:
          EPIORA_DENY_DB: ${{ runner.temp }}/advisory-dbs

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: app/playwright-report/
          if-no-files-found: ignore

      # First-load budget gate (v0.3 Task 17, spec §10.2): fails at or
      # above 5,000,000 bytes gzip -9. The budget describes the shipping
      # build, so it measures a second production build made without
      # VITE_TEST_HOOKS — the same pattern as the perf job's
      # dist-nohooks. Runs on every event, fork PRs included.
      - name: First-load budget
        run: |
          env -u VITE_TEST_HOOKS npm run build -- --outDir ../target/budget-dist --emptyOutDir
          set +e
          node scripts/budget.mjs ../target/budget-dist | tee ../target/budget.md
          rc=${PIPESTATUS[0]}
          set -e
          cat ../target/budget.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc
        working-directory: app

      # Netlify deploys (v0.3 spec §7.2; owner's Step 5 change on PR #49):
      # production deploys happen only on a published release, never on
      # pushes to main. Same-repo PRs get an `pr-<number>` alias preview,
      # manual runs a branch-name alias preview. Every step below only
      # runs after every gate above has passed, and never on fork PRs
      # (secrets stay env-only, so a fork would have no token anyway).
      # The push trigger exists to warm the Rust cache on main; it
      # matches none of these steps.

      - name: Build production dist
        if: >-
          github.event_name == 'release' || github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository)
        # check-app.sh built dist with VITE_TEST_HOOKS=1 for the e2e
        # suite; the deploy must ship a fresh build without it.
        run: env -u VITE_TEST_HOOKS npm run build
        working-directory: app

      - name: Assert no test hooks in the deploy build
        if: >-
          github.event_name == 'release' || github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          # A VITE_TEST_HOOKS=1 build compiles the __simulateQuotaOnNextWrite
          # guard out of the worker bundle, so its rejection message is a
          # canary that must be present; the flag's own identifier must
          # never ship at all.
          if ! grep -rqs 'test hooks are disabled' dist; then
            echo 'FAIL: dist is missing the test-hook guard — it was built with VITE_TEST_HOOKS=1' >&2
            exit 1
          fi
          if grep -rqs 'VITE_TEST_HOOKS' dist; then
            echo 'FAIL: dist contains the VITE_TEST_HOOKS identifier' >&2
            exit 1
          fi
        working-directory: app

      - name: Deploy preview (pull request)
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx netlify deploy --dir dist --alias "pr-${{ github.event.pull_request.number }}" --json > deploy.json
          url="$(node -p 'JSON.parse(require("fs").readFileSync("deploy.json", "utf8")).deploy_url')"
          echo "Deploy preview: ${url}"
          echo "Deploy preview: ${url}" >> "$GITHUB_STEP_SUMMARY"
        working-directory: app

      - name: Deploy preview (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          alias="$(printf '%s' "${GITHUB_REF_NAME}" \
            | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-' | cut -c1-37 | sed 's/^-*//; s/-*$//')"
          npx netlify deploy --dir dist --alias "${alias}" --json > deploy.json
          url="$(node -p 'JSON.parse(require("fs").readFileSync("deploy.json", "utf8")).deploy_url')"
          echo "Deploy preview (${alias}): ${url}"
          echo "Deploy preview (${alias}): ${url}" >> "$GITHUB_STEP_SUMMARY"
        working-directory: app

      - name: Deploy production (release published)
        if: github.event_name == 'release'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx netlify deploy --dir dist --prod --json > deploy.json
          url="$(node -p 'JSON.parse(require("fs").readFileSync("deploy.json", "utf8")).deploy_url')"
          echo "Production deploy: ${url}"
          echo "Production deploy: ${url}" >> "$GITHUB_STEP_SUMMARY"
        working-directory: app

  # Perf gate + measurement (v0.3 spec §10.3, Task 17): runs on push
  # to main (median of 5 samples, 1,000,000 rows) and on
  # workflow_dispatch — never on pull_request (owner decision on
  # PR #52, replacing the plan's "perf job on PRs" wording) and always
  # on the persistent, disk-backed Chromium profile (the ephemeral
  # context fails 1M imports with SQLITE_IOERR; kept for local
  # diagnosis only). One sample per Playwright test, each in a fresh
  # browser context/store. The spec's last test gates
  # import_1m ≤ 89,550 ms and open_tables_1m ≤ 2,874 ms (median of
  # successful samples ≤ threshold); the second pass below is the D7
  # report — both scenarios under CPU throttling ×4, medians in the
  # step summary, not gated.
  perf:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      PERF_SAMPLES: ${{ inputs.runs || 5 }}
      PERF_CSV_ROWS: ${{ inputs.rows || 1000000 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        run: npm ci
        working-directory: app

      - name: Install Playwright (chromium only)
        run: npx playwright install --with-deps chromium
        working-directory: app

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          rustup target add wasm32-unknown-unknown
          rustc --version

      # Only main writes the cache; dispatch runs restore from it.
      # This job compiles only the root workspace (the wasm builds).
      - name: Rust build cache
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: .
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install wasm-bindgen 0.2.129 (pinned, SHA-256 verified)
        run: |
          curl -sSfLo /tmp/wasm-bindgen.tar.gz \
            https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz
          echo '82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e  /tmp/wasm-bindgen.tar.gz' \
            | sha256sum -c -
          tar -xzf /tmp/wasm-bindgen.tar.gz -C /tmp
          sudo install -m 0755 \
            /tmp/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl/wasm-bindgen \
            /usr/local/bin/wasm-bindgen
          wasm-bindgen --version

      - name: Install wasm-pack 0.15.1 (pinned, SHA-256 verified)
        run: |
          curl -sSfLo /tmp/wasm-pack.tar.gz \
            https://github.com/rustwasm/wasm-pack/releases/download/v0.15.1/wasm-pack-v0.15.1-x86_64-unknown-linux-musl.tar.gz
          echo '410101009739b9d01c7d5affaaad6e9c9a24b4cba6791a4805db8e89b9bf7af2  /tmp/wasm-pack.tar.gz' \
            | sha256sum -c -
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          sudo install -m 0755 /tmp/wasm-pack-v0.15.1-x86_64-unknown-linux-musl/wasm-pack \
            /usr/local/bin/wasm-pack
          wasm-pack --version

      - name: Install binaryen version_133 wasm-opt (pinned, SHA-256 verified)
        run: |
          curl -sSfLo /tmp/binaryen.tar.gz \
            https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          echo '2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  /tmp/binaryen.tar.gz' \
            | sha256sum -c -
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          sudo install -m 0755 /tmp/binaryen-version_133/bin/wasm-opt /usr/local/bin/wasm-opt
          wasm-opt --version

      - name: Build wasm packages
        run: |
          scripts/wasm-build.sh release epiora-wasm
          scripts/wasm-build.sh release epiora-import-wasm

      # Generated in CI, never committed — the 1,000,000-row file is
      # ~80 MB. The 10,000-row file feeds the grid-scroll scenario.
      - name: Generate perf CSVs
        run: |
          node perf/gen-csv.mjs "$PERF_CSV_ROWS" "../target/perf/perf-${PERF_CSV_ROWS}.csv"
          node perf/gen-csv.mjs 10000 ../target/perf/perf-10000.csv
        working-directory: app

      # The spec drives window.dataApi plus the __clearSnapshotCache
      # test hook, so it needs the same VITE_TEST_HOOKS=1 build lane
      # as e2e — still a production `vite build`.
      - name: Build dist (test hooks for the perf spec)
        run: npm run build
        working-directory: app
        env:
          VITE_TEST_HOOKS: '1'

      # The first-load numbers must describe the shipping build —
      # VITE_TEST_HOOKS changes the entry chunk (TablesDialog's hook
      # gate) — so sizes are measured on a second build without the
      # flag; the summary prints both dists' columns side by side.
      - name: Build measurement dist (no test hooks)
        run: npm run build -- --outDir ../target/perf/dist-nohooks --emptyOutDir
        working-directory: app

      # OPFS evidence for the SQLITE_IOERR diagnosis: sahpool's xWrite
      # reports a bogus short count ("Unknown write() failure") when the
      # backing store refuses a write — df shows whether the profile's
      # filesystem was actually full, free whether RAM was.
      - name: Storage and memory before the perf spec
        run: |
          df -h / /tmp "$HOME" || true
          free -h || true

      - name: Run perf spec (persistent profile)
        run: >-
          EPIORA_PERF=1 PERF_RUNS=$PERF_SAMPLES
          PERF_ROWS=$PERF_CSV_ROWS
          PERF_PROFILE=persistent
          npx playwright test --project=chromium --workers=1
        working-directory: app

      # D7 report (spec §10.2): both gated scenarios under Chromium CPU
      # throttling ×4 — recorded as import_1m_cpu4 / open_tables_1m_cpu4
      # so they never touch the gated medians. 3 samples for a median;
      # reported in the step summary, not gated. `always()` so the
      # report still lands when the gate failed.
      - name: D7 report — CPU throttling ×4
        if: always()
        run: >-
          EPIORA_PERF=1 PERF_RUNS=3
          PERF_ROWS=$PERF_CSV_ROWS
          PERF_PROFILE=persistent
          PERF_CPU_THROTTLE=4
          npx playwright test --project=chromium --workers=1
        working-directory: app

      - name: Storage and memory after the perf spec
        if: always()
        run: |
          df -h / /tmp "$HOME" || true
          free -h || true

      - name: Summarise results
        if: always()
        run: |
          PERF_DIST=../target/perf/dist-nohooks PERF_COMPARE_DIST=dist \
            node perf/summarise.mjs ../target/perf/results.jsonl | tee ../target/perf/summary.md
          cat ../target/perf/summary.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f ../target/perf/gates.md ]; then
            cat ../target/perf/gates.md >> "$GITHUB_STEP_SUMMARY"
          fi
        working-directory: app

      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-results
          path: |
            target/perf/results.jsonl
            target/perf/summary.md
            target/perf/gates.md
          if-no-files-found: warn
