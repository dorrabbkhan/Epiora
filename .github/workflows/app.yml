name: app

# The app gate (v0.3 spec §10.1): strict typecheck, ESLint, Stylelint,
# token regeneration check, Vitest (units, contrast, lint rules),
# licence check, vite build and Playwright on all three engines.

on:
  pull_request:
    paths:
      - 'app/**'
      - 'crates/**'
      - 'scripts/check-app.sh'
      - 'scripts/check.sh'
      - '.github/workflows/app.yml'
  workflow_dispatch:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: app

      - name: check-app.sh full
        run: scripts/check-app.sh full

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: app/playwright-report/
          if-no-files-found: ignore
