name: legacy

# v1.1 Task 5: the legacy (.mdb/accdb) import gate. Rebuilds the
# committed epiora-mdb wasm module with the pinned emsdk toolchain and
# diffs it against app/public/mdb/ (reproducibility), verifies the
# pinned test-data checksums, and runs the epiora-mdb / epiora-legacy
# cargo tests. The wasm/native parity test itself is part of the app
# gate (app/src/legacy/mdb.test.ts runs under vitest).

on:
  pull_request:
    paths:
      - 'crates/epiora-mdb/**'
      - 'crates/epiora-legacy/**'
      - 'app/public/mdb/**'
      - 'app/src/legacy/**'
      - 'app/src/tauri/**'
      - 'app/src-tauri/**'
      - 'fixtures/legacy/**'
      - 'Cargo.*'
      - 'deny.toml'
      - '.github/workflows/legacy.yml'
  workflow_dispatch:

env:
  EMSDK_COMMIT: 'd7b4130688bfa348392b921ab04015aa15c4f154'
  EMSDK_VERSION: '6.0.13'
  # emsdk install 6.0.13 on linux-x64 downloads these two archives into
  # $EMSDK/downloads/ (kept via EMSDK_KEEP_DOWNLOADS); pinned by SHA-256.
  EMSDK_KEEP_DOWNLOADS: '1'
  EMSDK_SDK_SHA256: 'cda6801012ff3319a539111826ed02a9abd7eff135c2ef261c8941caf5a3763e'  # wasm-binaries.tar.xz
  EMSDK_NODE_SHA256: '14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647'  # node-v24.19.0-linux-x64.tar.xz
  SAMPLE_MDB_SHA256: 'c3f70af4aef2de572aadeb127e74661667642b325d9f0f2792f1e60e00f9078e'
  JET3_MDB_SHA256: '27788b47e17412427830e80c2cb69366885aa11b12c61422de73029194bef135'
  INDEXCODES_MDB_SHA256: '75c7b039f339e0cf364320ee988002811fd6c4e37e91033356fd16c7eb6a82b1'
  PWDSET_MDB_SHA256: '9177af1f5c01c66a3d3be9b61a975856285c18ce6f481baa158bf176726519a5'
  NATIVE_CSV_SHA256: 'ada2049737fcb31412692a979b1017ce11583a4c03d41d66b2b1ea7113d5de67'

jobs:
  mdb-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.99.0 (pinned)
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.99.0
          rustc --version

      - name: Verify pinned test-data checksums
        run: |
          echo "$SAMPLE_MDB_SHA256  fixtures/legacy/samples/ei7/Sample/Sample.mdb" | sha256sum -c -
          echo "$JET3_MDB_SHA256  crates/epiora-mdb/tests/data/testV1997.mdb" | sha256sum -c -
          echo "$INDEXCODES_MDB_SHA256  crates/epiora-mdb/tests/data/testIndexCodesV1997.mdb" | sha256sum -c -
          echo "$PWDSET_MDB_SHA256  crates/epiora-mdb/tests/data/pwd-set.mdb" | sha256sum -c -
          echo "$NATIVE_CSV_SHA256  crates/epiora-mdb/tests/data/Oswego12.native.csv" | sha256sum -c -

      - name: Install Emscripten (pinned commit + SDK version)
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" fetch --depth 1 origin "$EMSDK_COMMIT"
          git -C "$RUNNER_TEMP/emsdk" checkout "$EMSDK_COMMIT"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"

      - name: Verify emsdk-downloaded archive checksums
        run: |
          ls -l "$EMSDK/downloads/"
          echo "$EMSDK_SDK_SHA256  $EMSDK/downloads/eb132757325583b787fe9414b09afea9442b72ad-wasm-binaries.tar.xz" | sha256sum -c -
          echo "$EMSDK_NODE_SHA256  $EMSDK/downloads/node-v24.19.0-linux-x64.tar.xz" | sha256sum -c -

      - name: Rebuild the wasm module and require it unchanged
        run: |
          crates/epiora-mdb/build-wasm.sh
          git diff --exit-code -- app/public/mdb/mdb.js app/public/mdb/mdb.wasm
          if [ -n "$(git ls-files --others --exclude-standard -- app/public/mdb)" ]; then
            echo "untracked files in app/public/mdb" >&2
            exit 1
          fi

      - name: cargo test epiora-mdb + epiora-legacy
        run: cargo test -p epiora-mdb -p epiora-legacy

  # v1.1 Task 9 (spec §4.1, §8.2): the desktop one-time SQL Server
  # import. The service container runs SQL Server 2022 Developer
  # edition (spec §13: CI only, never distributed; Microsoft developer
  # licence). `fixtures/legacy/copy-tables.mjs` emits the verbatim
  # Access→T-SQL copy of Sample.mdb, a pinned go-sqlcmd loads it into
  # the `sample` database, and `app/src-tauri/tests/sqlserver.rs` maps
  # it through Task 7's mapper to compare dataset hashes against the
  # Access golden. Connection values live only in this job's env —
  # the SA password is a throwaway for the ephemeral container.
  sqlserver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: ${{ env.MSSQL_SA_PASSWORD }}
          MSSQL_PID: Developer
        ports:
          - 1433:1433
    env:
      NODE_VERSION: '22.23.4'
      MDB_VERSION: '1.0.1'
      MDB_SHA256: 'ff9c425a88bc20bf9318a332eec50b17e77896eef65a0e69415ccb4e396d1812'
      # Same 4 MiB bind size as legacy-golden.yml — upstream's 200 KB
      # default would truncate MEMO check code and break hash parity.
      EXPORT_BIND_SIZE: '4194304'
      SQLCMD_VERSION: '1.10.0'
      SQLCMD_SHA256: '92516d98c63d99b0994de5b61350c91f6915f9b76f139a59039fbcb225c2e987'
      MSSQL_SA_PASSWORD: 'Ep1ora-CI-Str0ng!pass'
      EPIORA_SQLSERVER_HOST: '127.0.0.1'
      EPIORA_SQLSERVER_PORT: '1433'
      EPIORA_SQLSERVER_DATABASE: 'sample'
      EPIORA_SQLSERVER_USER: 'sa'
      EPIORA_SQLSERVER_PASSWORD: ${{ env.MSSQL_SA_PASSWORD }}
      EPIORA_SQLSERVER_TRUST_CERT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install mdbtools and the Tauri Linux build deps from apt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mdbtools \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libdbus-1-dev pkg-config
          apt-cache policy mdbtools | grep -E 'Installed|mdbtools'

      # `cargo test` compiles the package's dependency graph for
      # --extern; generate_context!() is not built (only --test
      # sqlserver), but tauri-build still reads the config — same stub
      # as app.yml's native-store job.
      - name: Stub app/dist for codegen
        run: |
          mkdir -p app/dist
          echo '<!doctype html><title>codegen stub</title>' > app/dist/index.html

      - name: Build mdb-export at EXPORT_BIND_SIZE=4194304 (pinned tarball)
        run: |
          curl -sSL -o "$RUNNER_TEMP/mdbtools-$MDB_VERSION.tar.gz" \
            "https://github.com/mdbtools/mdbtools/releases/download/v$MDB_VERSION/mdbtools-$MDB_VERSION.tar.gz"
          echo "$MDB_SHA256  $RUNNER_TEMP/mdbtools-$MDB_VERSION.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/mdbtools-$MDB_VERSION.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/mdbtools-$MDB_VERSION"
          sed -i "s/^#define EXPORT_BIND_SIZE 200000/#define EXPORT_BIND_SIZE $EXPORT_BIND_SIZE/" src/util/mdb-export.c
          ./configure --disable-glib --disable-man
          make -C src -j"$(nproc)"
          echo "MDB_EXPORT=$RUNNER_TEMP/mdbtools-$MDB_VERSION/src/util/mdb-export" >> "$GITHUB_ENV"

      - name: Install go-sqlcmd (pinned, SHA-256 verified)
        run: |
          curl -sSfLo "$RUNNER_TEMP/sqlcmd.tar.bz2" \
            "https://github.com/microsoft/go-sqlcmd/releases/download/v$SQLCMD_VERSION/sqlcmd-linux-amd64.tar.bz2"
          echo "$SQLCMD_SHA256  $RUNNER_TEMP/sqlcmd.tar.bz2" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/sqlcmd-bin"
          tar xjf "$RUNNER_TEMP/sqlcmd.tar.bz2" -C "$RUNNER_TEMP/sqlcmd-bin"
          "$RUNNER_TEMP/sqlcmd-bin/sqlcmd" --version

      - name: Emit the verbatim Access to T-SQL copy
        run: node fixtures/legacy/copy-tables.mjs --mdb fixtures/legacy/samples/ei7/Sample/Sample.mdb --tsql "$RUNNER_TEMP/sample.sql"

      - name: Wait for SQL Server and load the copy
        run: |
          SQLCMD="$RUNNER_TEMP/sqlcmd-bin/sqlcmd"
          for i in $(seq 1 60); do
            if "$SQLCMD" -S "127.0.0.1,$EPIORA_SQLSERVER_PORT" -U "$EPIORA_SQLSERVER_USER" -P "$MSSQL_SA_PASSWORD" -C -l 5 -Q "SELECT 1" >/dev/null 2>&1; then
              break
            fi
            if [ "$i" = 60 ]; then echo "SQL Server did not become ready" >&2; exit 1; fi
            sleep 2
          done
          "$SQLCMD" -S "127.0.0.1,$EPIORA_SQLSERVER_PORT" -U "$EPIORA_SQLSERVER_USER" -P "$MSSQL_SA_PASSWORD" -C -l 30 -Q "CREATE DATABASE [$EPIORA_SQLSERVER_DATABASE]"
          "$SQLCMD" -S "127.0.0.1,$EPIORA_SQLSERVER_PORT" -U "$EPIORA_SQLSERVER_USER" -P "$MSSQL_SA_PASSWORD" -C -l 60 -d "$EPIORA_SQLSERVER_DATABASE" -i "$RUNNER_TEMP/sample.sql"

      - name: Install Rust 1.99.0 (pinned)
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          rustc --version

      - name: Rust build cache
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: app/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo test --test sqlserver
        working-directory: app/src-tauri
        run: cargo test -p epiora-app --test sqlserver -- --nocapture
